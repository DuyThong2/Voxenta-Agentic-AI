[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "fastapi>=0.115.0",
    "PyJWT[crypto]>=2.10.0",
    "uvicorn[standard]>=0.34.0",
    "bs4>=0.0.2",
    "httpx>=0.28.1",
    "ipywidgets>=8.1.5",
    "langchain-anthropic>=0.3.10",
    "langchain-community>=0.3.20",
    "langchain-experimental>=0.3.4",
    "langchain-openai>=0.3.9",
    "langgraph>=0.3.18",
    "langgraph-checkpoint-sqlite>=2.0.6",
    "langsmith>=0.3.18",
    "lxml>=5.3.1",
    "mcp-server-fetch>=2025.1.17",
    "mcp[cli]>=1.5.0",
    "openai>=1.68.2",
    "openai-agents>=0.0.15",
    "plotly>=6.0.1",
    "polygon-api-client>=1.14.5",
    "psutil>=7.0.0",
    "pypdf>=5.4.0",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "sendgrid>=6.11.0",
    # Upper-bounded below 80: newer setuptools (confirmed: 82.0.1) has removed the legacy
    # `pkg_resources` module entirely, which mmengine's get_installed_path() (used by mmpose,
    # an avatar-pipeline dependency below) imports directly — found while testing the avatar
    # deps end-to-end in spikes/.venv, see spikes/pyproject.toml for the full story.
    "setuptools>=78.1.0,<80",
    "smithery>=0.1.0",
    "speedtest-cli>=2.1.3",
    "wikipedia>=1.4.0",
    "psycopg[binary]>=3.2.0",
    "aiokafka>=0.12.0",
    "psycopg-pool>=3.3.0",
    "langgraph-checkpoint-postgres>=3.0.3",
    "uuid-utils>=0.13.0",
    "chromadb>=1.4.1",
    "aiortc>=1.9.0",
    "opencv-python-headless>=4.10.0",
    "mediapipe>=0.10.14",
    "ultralytics>=8.3.0",
    "numpy==1.26.4",
    "pydantic>=2.8.0",
    "azure-cognitiveservices-speech>=1.50.0",
    "boto3>=1.38.46",
    "azure-ai-voicelive[aiohttp]>=1.2.0",
    "torch==2.3.0",
    "torchvision==0.18.0",
    "torchaudio==2.3.0",
    # Downgraded from 2.5.1/0.20.1/2.5.1 (2026-06-25): mmcv's compiled CUDA extension
    # (mmcv.ops.active_rotated_filter -> `_ext`) is built against torch==2.3.0 specifically and
    # FAILED TO LOAD under torch==2.5.1 (`ImportError: DLL load failed while importing _ext`) —
    # confirmed by actually running the full avatar pipeline through this venv, not just an
    # import smoke test. OpenMMLab does not publish mmcv wheels for any torch version newer than
    # 2.3.0 on any CUDA index (checked cu118 and cu121, both stop at torch2.3.0) — so matching
    # torch to exactly 2.3.0 is the only way to use mmcv/mmpose/mmdet for real (not just pass
    # their import-time version-string checks). `ultralytics` only requires `torch>=1.8.0`
    # (confirmed via PyPI metadata), so this isn't a real constraint conflict — torch==2.5.1 was
    # just "whatever was installed" when the CPU->CUDA fix was first made, not a hard requirement
    # from any dependency. Re-verify ultralytics/YOLO proctoring still works after this change.

    # --- Avatar pipeline deps (LivePortrait + MuseTalk), added 2026-06-25 in preparation for
    # Phase 4 (agents/src/realtime/avatar_renderer.py) since they'll need to live here
    # eventually anyway. CONFIRMED working via `uv lock`/`uv sync` + a clean import smoke test
    # (torch/mmcv/mmdet/mmpose/tensorflow all import without any manual post-sync step) — every
    # fix needed is already applied declaratively below ([tool.uv.sources]' vendored mmdet/mmpose
    # wheels, override-dependencies for numpy/jax, extra-build-dependencies for chumpy, the
    # setuptools upper bound above). torch is now unified with spikes/pyproject.toml's exact
    # version (2.3.0) — see the comment above for why.
    "mmengine>=0.10.0",
    "mmcv==2.2.0",
    "mmdet==3.1.0",
    "mmpose==1.1.0",
    "tensorflow==2.12.0",
    # On Windows, the "tensorflow" wheel is an empty stub that redirects to tensorflow-intel
    # (see its METADATA: `Requires-Dist: tensorflow-intel (==2.12.0) ; platform_system ==
    # "Windows"`) — uv's lock did NOT pull this in automatically (confirmed: absent from
    # uv.lock's tensorflow dependencies block), so it must be declared explicitly or `import
    # tensorflow` fails with ModuleNotFoundError despite tensorflow's dist-info being installed.
    "tensorflow-intel==2.12.0; sys_platform == 'win32'",
    "tensorflow-io-gcs-filesystem==0.31.0",
    "onnxruntime-gpu==1.18.0",
    "diffusers==0.30.2",
    "accelerate==0.28.0",
    "transformers==4.39.2",  # unbounded resolved to 5.12.1 (breaking major-version jump, real
    # NameError crash) when testing this in spikes/.venv — pinned to MuseTalk's exact tested
    # version, see spikes/pyproject.toml for the full story.
    "librosa>=0.11.0",
    "einops>=0.8.1",
    "soundfile>=0.12.1",
    "gdown",
    "omegaconf>=2.3.1",
    "moviepy>=1.0.3",
    "albumentations==1.4.10",
    "scikit-image>=0.24.0",
    "scipy>=1.13.1",
    "tyro>=0.8.5",
    "gradio>=5.1.0",
    "pykalman>=0.9.7",
    "imageio>=2.34.2",
    "imageio-ffmpeg>=0.5.1",
    "ffmpeg-python>=0.2.0",
    "onnx>=1.16.1",
    "patch-ng>=1.19.1",
    "pip",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

# mmpose's dependency chumpy needs `pip` itself as a build dependency (legacy setup.py does
# `import pip` directly) — same fix as spikes/pyproject.toml.
[tool.uv.extra-build-dependencies]
chumpy = ["pip"]

# numpy<1.24 is what tensorflow==2.12.0 declares, but numpy==1.26.4 (needed by
# albumentations/opencv-python-headless for the avatar deps above) is what's actually confirmed
# working — same override as spikes/pyproject.toml; without it `uv sync` refuses to resolve.
#
# jax: pulled in transitively by tensorflow-intel (Windows-only, for an obscure TF Lite
# "authoring" submodule that gets imported unconditionally as part of `import tensorflow`).
# Without a pin, uv resolved the latest jax (0.10.2 at time of writing), whose
# jax/_src/dtypes.py unconditionally calls `np.dtypes.StringDType()` — an attribute that only
# exists in numpy>=2.0. That crashes `import tensorflow` outright under our pinned numpy==1.26.4.
# Pinned to a pre-numpy-2.0-era jax release (numpy 2.0 shipped mid-2024) so this code path simply
# doesn't exist yet in the version installed.
[tool.uv]
override-dependencies = ["numpy==1.26.4", "jax==0.4.13"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu118" }]
torchvision = [{ index = "pytorch-cu118" }]
mmcv = [{ index = "openmmlab-cu118-torch230" }]
# cu118, not cu121 (downgraded from this file's original cu121 pin, 2026-06-25): root-caused why
# onnxruntime-gpu==1.18.0's CUDA execution provider always fell back to CPU in spikes/.venv —
# its onnxruntime_providers_cuda.dll imports cublas64_11.dll/cudart64_110.dll/cufft64_10.dll
# (a CUDA-11-built provider; confirmed via pefile), but cu121 torch only bundles CUDA-12 DLLs, so
# the dependency could never resolve. onnxruntime-gpu only ships CUDA-12 builds via an unstable
# nightly-only feed (no stable release), so matching torch to CUDA 11.8 is the durable fix.
# Applied here too (not just spikes/pyproject.toml) so Phase 4 doesn't inherit this same
# CPU-fallback bug when the avatar pipeline is wired into this venv for real. The GPU driver
# (CUDA 13.2-capable) runs CUDA 11.8 binaries fine — newer drivers are always backwards-compatible
# with older CUDA runtimes. Re-verify ultralytics/YOLO still loads correctly after this change
# (expected to be fine — it's not CUDA-minor-version-sensitive — but hasn't been re-confirmed
# since the switch).
# mmdet/mmpose hard-assert an mmcv upper bound at import time (mmdet: always <2.2.0, even on its
# current main branch — verified on GitHub; mmpose 1.1.0 specifically: <=2.1.0, fixed in 1.3.2+ but
# we're pinned to 1.1.0). The only prebuilt mmcv wheel for our torch/cuda/python combo is 2.2.0,
# which mmdet rejects outright — no version of mmdet accepts it. These are the exact same
# mmdet==3.1.0/mmpose==1.1.0 wheels from PyPI with only their `mmcv_maximum_version` string
# widened to '2.2.1' (pure-Python wheels, no compiled code touched) so `uv sync` alone resolves a
# working install with no manual post-sync step, on this machine or anywhere else this repo is
# cloned (including a future EKS image — these are platform-independent).
mmdet = { path = "vendor/mmdet-3.1.0-py3-none-any.whl" }
mmpose = { path = "vendor/mmpose-1.1.0-py2.py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "openmmlab-cu118-torch230"
# This index is keyed to torch2.3.0 specifically (OpenMMLab publishes one per exact torch
# version) — torch above is now pinned to exactly 2.3.0 to match, after confirming mmcv's
# compiled extension fails to load (`ImportError: DLL load failed while importing _ext`) under
# torch==2.5.1. OpenMMLab does not publish mmcv wheels for any torch newer than 2.3.0 on any CUDA
# index (checked both cu118 and cu121) — there is no newer index to "upgrade" to later short of
# OpenMMLab publishing one or building mmcv from source.
url = "https://download.openmmlab.com/mmcv/dist/cu118/torch2.3.0/index.html"
format = "flat"
explicit = true


