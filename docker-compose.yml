services:
  # =====================
  # Databases
  # =====================
  postgres:
    image: postgres:16-alpine
    container_name: vox-postgres
    environment:
      POSTGRES_DB: ${PG_DB:-vox_langgraph}
      POSTGRES_USER: ${PG_USER:-vox}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-Vox_password1!}
    ports:
      - "5433:5432"
    volumes:
      - memory-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - agents-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-vox} -d ${PG_DB:-vox_langgraph}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  chroma:
    image: chromadb/chroma:latest
    container_name: vox-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/data
    networks:
      - agents-internal

  # =====================
  # Python Agents (FastAPI)
  # =====================

networks:
  agents-internal:
    driver: bridge

  vox-network:
    external: true
    name: vox_vox-network

volumes:
  memory-postgres-data:
  chroma_data:
