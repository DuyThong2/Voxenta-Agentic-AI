name: CD Test

# Bản CD riêng cho nhánh test hiện tại (assetShowing) -- tách khỏi cd.yml
# (chỉ chạy cho `main`) để không đụng pipeline chính. Trigger thẳng trên push, không
# qua workflow_run: workflow_run chỉ fire khi file workflow đã tồn tại trên nhánh MẶC
# ĐỊNH của repo, nên một nhánh test sẽ không bao giờ kích được nó -- và im lặng chứ
# không báo lỗi. Đổi lại: không có cổng CI trước khi build/push ECR, chấp nhận được
# cho mục đích test nhanh, không dùng cho nhánh production. Cùng pattern với
# vox/cd-test.yml và vox-streaming/cd-test.yml.
#
# ⚠️ TÊN NHÁNH DƯỚI ĐÂY PHẢI KHỚP NHÁNH ĐANG LÀM VIỆC, nếu không workflow không
# chạy lần nào và KHÔNG BÁO LỖI GÌ -- push xong chỉ thấy im lặng, rất dễ tưởng
# CI hỏng. Cập nhật 2026-08-19: personalizePrototype -> assetShowing.
on:
  push:
    branches:
      - assetShowing

jobs:
  docker-build-push:
    name: Build Docker image and push to ECR
    runs-on: ubuntu-latest
    outputs:
      ecr_image: ${{ steps.build_outputs.outputs.ecr_image }}
      image_tag: ${{ steps.build_outputs.outputs.image_tag }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tag
        run: echo "tag=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set job outputs
        id: build_outputs
        run: |
          echo "ecr_image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ steps.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

  update-helm:
    name: Update vox-helm image tag
    runs-on: ubuntu-latest
    needs: docker-build-push
    env:
      HELM_REPO_NAME: ${{ vars.HELM_REPO_NAME }}
      HELM_REPO_OWNER: ${{ vars.HELM_REPO_OWNER || secrets.HELM_REPO_USER }}
      ECR_IMAGE: ${{ needs.docker-build-push.outputs.ecr_image }}
      IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
    steps:
      - name: Install yq
        run: |
          sudo curl -L https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Clone Helm repository
        run: |
          git clone "https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/${HELM_REPO_OWNER}/${HELM_REPO_NAME}.git" helm-repo

      - name: Update values.yaml
        run: |
          cd helm-repo
          yq eval '.image.repository = env(ECR_IMAGE) | .image.tag = strenv(IMAGE_TAG)' -i charts/agents/values.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if ! git diff --quiet; then
            git add charts/agents/values.yaml
            git commit -m "Update agents image tag to ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
