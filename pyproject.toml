[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.49.0",
    "fastapi>=0.115.0",
    "PyJWT[crypto]>=2.10.0",
    "uvicorn[standard]>=0.34.0",
    "bs4>=0.0.2",
    "httpx>=0.28.1",
    "ipywidgets>=8.1.5",
    "langchain-anthropic>=0.3.10",
    "langchain-community>=0.3.20",
    "langchain-experimental>=0.3.4",
    "langchain-openai>=0.3.9",
    "langgraph>=0.3.18",
    "langgraph-checkpoint-sqlite>=2.0.6",
    "langsmith>=0.3.18",
    "lxml>=5.3.1",
    "mcp-server-fetch>=2025.1.17",
    "mcp[cli]>=1.5.0",
    "openai>=1.68.2",
    "openai-agents>=0.0.15",
    "plotly>=6.0.1",
    "polygon-api-client>=1.14.5",
    "psutil>=7.0.0",
    "pypdf>=5.4.0",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "sendgrid>=6.11.0",
    "smithery>=0.1.0",
    "speedtest-cli>=2.1.3",
    "wikipedia>=1.4.0",
    "psycopg[binary]>=3.2.0",
    "aiokafka>=0.12.0",
    "psycopg-pool>=3.3.0",
    "langgraph-checkpoint-postgres>=3.0.3",
    "uuid-utils>=0.13.0",
    "chromadb>=1.4.1",
    "aiortc>=1.9.0",
    "opencv-python-headless>=4.10.0",
    "mediapipe>=0.10.14",
    "ultralytics>=8.3.0",
    "numpy==1.26.4",
    "pydantic>=2.8.0",
    "azure-cognitiveservices-speech>=1.50.0",
    "boto3>=1.38.46",
    "azure-ai-voicelive[aiohttp]>=1.2.0",
    # Pinned to a known-working CUDA build for ultralytics/YOLO proctoring (the only real consumer
    # now that the self-hosted LivePortrait+MuseTalk avatar pipeline that originally drove this
    # exact pin/index has been removed) -- see [tool.uv.sources] below for why cu118 specifically.
    "torch==2.3.0",
    "torchvision==0.18.0",
    "torchaudio==2.3.0",
    "cramjam>=2.11.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.0",
]

[tool.uv.sources]
# cu118 (not cu121/default): confirmed working for ultralytics/YOLO's CUDA build on this GPU
# (RTX 2000 Ada). Originally chosen to match an onnxruntime-gpu requirement from the now-removed
# avatar pipeline, but kept since it's a known-working pin. Other platforms fall back to PyPI;
# in particular, macOS uses Apple's Metal (MPS) backend rather than CUDA.
torch = [
    { index = "pytorch-cu118", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')" },
]
torchvision = [
    { index = "pytorch-cu118", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')" },
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
